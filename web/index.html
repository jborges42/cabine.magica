<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cabine Mágica · SENAI Fraiburgo</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📸</text></svg>">
  <style>
    /* Century Gothic é a fonte da identidade SENAI. Se não estiver instalada (vem com o Office),
       usa a TeX Gyre Adventor, clone livre incluído em fontes/ — funciona sem internet. */
    @font-face { font-family: "Marca"; font-weight: 400; src: local("Century Gothic"), local("CenturyGothic"), url("fontes/texgyreadventor-regular.otf"); }
    @font-face { font-family: "Marca"; font-weight: 700; src: local("Century Gothic Bold"), local("CenturyGothic-Bold"), url("fontes/texgyreadventor-bold.otf"); }

    :root {
      /* sobrescritas pelo config.json (cor_primaria, cor_destaque) */
      --cor-primaria: #164193;  /* azul SENAI */
      --cor-destaque: #E84910;  /* laranja SENAI */
      --fundo: #061131;
      --vidro: rgb(255 255 255 / .06);
      --linha: rgb(255 255 255 / .14);
      --texto: #F5F7FC;
      --suave: #AFBAD8;
      --perigo: #FF8A96;
      --ok: #3DDC97;
      --raio: 24px;
      --fonte: "Marca", "Century Gothic", system-ui, sans-serif;
      color-scheme: dark;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      overflow: hidden;
      padding-left: 26px; /* barra lateral */
      color: var(--texto);
      font: 400 18px/1.45 var(--fonte);
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(80vmax 70vmax at -10% -25%, color-mix(in oklab, var(--cor-primaria) 80%, transparent), transparent 62%),
        radial-gradient(55vmax 45vmax at 112% 118%, color-mix(in oklab, var(--cor-destaque) 24%, transparent), transparent 60%),
        var(--fundo);
    }
    button { font: inherit; color: inherit; cursor: pointer; }
    :focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

    /* Barra lateral da identidade: laranja, vão diagonal de ~36°, azul (proporções de ref/barra_lateral.png) */
    .barra { --b: 26px; position: fixed; inset: 0 auto 0 0; width: var(--b); z-index: 2; pointer-events: none; }
    .barra::before, .barra::after { content: ""; position: absolute; left: 0; right: 0; }
    .barra::before { top: 0; height: calc(var(--b) * 2.51); background: var(--cor-destaque); clip-path: polygon(0 0, 100% 0, 100% 71%, 0 100%); }
    .barra::after { top: calc(var(--b) * 3.06); bottom: 0; background: var(--cor-primaria); clip-path: polygon(0 calc(var(--b) * .73), 100% 0, 100% 100%, 0 100%); }

    /* ---------- topo ---------- */
    .topo { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 22px 32px; }
    .marca { display: flex; align-items: center; gap: 20px; }
    .marca img { height: 34px; }
    .marca span {
      padding-left: 20px; border-left: 1px solid var(--linha);
      font-weight: 700; font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--suave);
    }
    .chip {
      display: inline-flex; align-items: center; gap: 9px; max-width: 45vw;
      padding: 9px 16px; border-radius: 999px; border: 1px solid var(--linha); background: var(--vidro);
      color: var(--suave); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .chip::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--suave); }
    [data-estado="ao-vivo"] .chip::before, [data-estado="contagem"] .chip::before { background: var(--ok); box-shadow: 0 0 10px var(--ok); animation: pulsar 2s infinite; }
    [data-estado="erro"] .chip::before { background: var(--perigo); }

    /* ---------- palco (prévia ao vivo) ---------- */
    .palco { position: relative; min-height: 0; }
    #tela {
      position: absolute; inset: 0; margin: auto; max-width: calc(100% - 64px); max-height: 100%;
      border-radius: var(--raio); background: #000;
      box-shadow: 0 0 0 1px var(--linha), 0 40px 100px -30px rgb(0 0 0 / .8), 0 0 140px -50px var(--cor-primaria);
      transition: opacity .4s;
    }
    [data-estado="carregando"] #tela, [data-estado="erro"] #tela { opacity: 0; }
    .contagem {
      position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
      font: 700 min(44vh, 32vw)/1 var(--fonte); color: #fff;
      -webkit-text-stroke: .025em var(--cor-primaria); paint-order: stroke fill;
      text-shadow: 0 0 80px color-mix(in oklab, var(--cor-destaque) 60%, transparent), 0 12px 50px rgb(0 0 0 / .5);
    }

    /* ---------- controles ---------- */
    .controles { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 32px; padding: 22px 32px 28px; }
    [data-estado]:not([data-estado="ao-vivo"]) .controles { visibility: hidden; }
    .dica { display: flex; align-items: center; gap: 10px; color: var(--suave); font-size: 15px; }
    .dica:last-child { justify-content: flex-end; }
    .dica strong { color: var(--texto); }
    kbd {
      display: inline-block; min-width: 2.3em; padding: 6px 9px; text-align: center;
      font: 700 13px/1 var(--fonte); color: var(--texto);
      border: 1px solid var(--linha); border-bottom-width: 3px; border-radius: 8px; background: rgb(255 255 255 / .08);
    }
    .disparo {
      width: 88px; height: 88px; padding: 7px; border-radius: 50%;
      border: 4px solid #fff; background: transparent;
      box-shadow: 0 0 0 10px rgb(255 255 255 / .06), 0 0 70px -6px color-mix(in oklab, var(--cor-destaque) 80%, transparent);
    }
    .disparo::after {
      content: ""; display: block; width: 100%; height: 100%; border-radius: 50%;
      background: var(--cor-destaque); transition: transform .18s;
    }
    .disparo:hover::after { transform: scale(.9); }
    .disparo:active::after { transform: scale(.8); }

    .flash { position: fixed; inset: 0; z-index: 3; background: #fff; opacity: 0; pointer-events: none; }

    /* ---------- painéis sobrepostos ---------- */
    .painel {
      position: fixed; inset: 0; display: none; place-items: center; padding: 40px 40px 40px 66px;
      background: rgb(6 17 49 / .86); backdrop-filter: blur(28px) saturate(1.2);
    }
    [data-estado="revisao"] #revisao, [data-estado="enviado"] #enviado, [data-estado="erro"] #erro-painel { display: grid; }

    .revisao { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(400px, 1fr); gap: 56px; align-items: center; width: min(1500px, 100%); }
    .revisao-foto { display: grid; gap: 18px; justify-items: center; min-width: 0; }
    #foto {
      display: block; width: 100%; max-height: 72vh; object-fit: contain; border-radius: 18px;
      box-shadow: 0 0 0 1px var(--linha), 0 50px 120px -30px rgb(0 0 0 / .9);
      animation: revelar .8s cubic-bezier(.2, .9, .25, 1.1) both; transition: opacity .25s, filter .25s;
    }
    #foto.tratando { opacity: .55; filter: saturate(.6); }
    .ajustes { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; }
    .ajustes kbd { margin-inline: 2px; }
    .ajustes .rotulo { margin-left: 10px; color: var(--suave); font-size: 14px; }
    #presets { display: contents; }
    #presets button {
      padding: 9px 16px; border-radius: 999px; border: 1px solid var(--linha); background: var(--vidro);
      font-size: 15px; font-weight: 700; color: var(--suave); transition: background .15s, color .15s;
    }
    #presets button[aria-pressed="true"] { background: var(--cor-destaque); border-color: transparent; color: #fff; }
    .cartao {
      position: relative; display: grid; gap: 14px; padding: 40px 40px 36px; border-radius: var(--raio); overflow: hidden;
      border: 1px solid var(--linha); background: linear-gradient(180deg, rgb(255 255 255 / .09), rgb(255 255 255 / .03));
      box-shadow: 0 40px 100px -40px rgb(0 0 0 / .9);
      animation: subir .6s .15s cubic-bezier(.2, .8, .2, 1) both;
    }
    .sobretitulo { font-weight: 700; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--cor-destaque); }
    .titulo { font: 700 clamp(30px, 3.1vw, 46px)/1.08 var(--fonte); text-transform: uppercase; letter-spacing: -.01em; }
    .titulo em { font-style: normal; color: var(--cor-destaque); }
    .cartao label { margin-top: 8px; color: var(--suave); }
    .campo {
      display: flex; align-items: center; gap: 14px; padding: 0 20px; border-radius: 16px;
      border: 2px solid var(--linha); background: rgb(0 0 0 / .3); transition: border-color .2s, box-shadow .2s;
    }
    .campo:focus-within { border-color: var(--cor-destaque); box-shadow: 0 0 0 6px color-mix(in oklab, var(--cor-destaque) 24%, transparent); }
    .campo:has([aria-invalid="true"]) { border-color: var(--perigo); box-shadow: 0 0 0 6px color-mix(in oklab, var(--perigo) 18%, transparent); animation: tremer .35s; }
    .campo span { color: var(--suave); font: 700 clamp(20px, 1.7vw, 28px)/1 var(--fonte); }
    #whatsapp {
      flex: 1; width: 100%; min-width: 0; padding: 20px 0; border: 0; outline: 0; background: none; color: var(--texto);
      font: 700 clamp(24px, 2.1vw, 40px)/1 var(--fonte); font-variant-numeric: tabular-nums;
    }
    #whatsapp::placeholder { color: rgb(255 255 255 / .22); }
    .erro { min-height: 1.45em; color: var(--perigo); font-size: 15px; }
    .botao {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 20px 24px; border-radius: 14px; border: 0; font-weight: 700; font-size: 20px; transition: transform .15s, filter .15s;
    }
    .botao:hover { filter: brightness(1.08); }
    .botao:active { transform: scale(.98); }
    .botao:disabled { opacity: .6; cursor: progress; }
    .primario { background: var(--cor-destaque); color: #fff; }
    .primario kbd { color: inherit; border-color: rgb(255 255 255 / .35); background: rgb(0 0 0 / .12); }
    .secundario { background: transparent; border: 1px solid var(--linha); font-size: 18px; }
    .legal { margin-top: 4px; color: var(--suave); font-size: 13px; }

    .final { display: grid; justify-items: center; gap: 18px; max-width: 760px; text-align: center; }
    .final p { color: var(--suave); font-size: clamp(18px, 1.6vw, 24px); }
    .selo { width: 116px; height: 116px; fill: none; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    .selo circle { fill: var(--cor-destaque); stroke: none; }
    .selo path { stroke: #fff; stroke-dasharray: 40; animation: tracar .6s .2s ease-out both; }
    .barra-tempo { width: 240px; height: 6px; margin-top: 14px; border-radius: 99px; background: var(--vidro); overflow: hidden; }
    .barra-tempo span { display: block; height: 100%; background: var(--cor-destaque); transform-origin: left; animation: esvaziar 6s linear both; }
    #erro-painel .cartao { max-width: 600px; text-align: center; justify-items: center; }
    #erro-painel .titulo { font-size: clamp(26px, 2.4vw, 36px); }
    #erro-painel p { color: var(--suave); }

    @keyframes pulsar { 50% { opacity: .35; } }
    @keyframes revelar { from { opacity: 0; transform: translateY(50px) scale(.94); } }
    @keyframes subir { from { opacity: 0; transform: translateY(24px); } }
    @keyframes tremer { 25% { translate: -8px; } 50% { translate: 6px; } 75% { translate: -3px; } }
    @keyframes tracar { from { stroke-dashoffset: 40; } }
    @keyframes esvaziar { to { transform: scaleX(0); } }
    @media (max-width: 1000px) { .dica { display: none; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

    @media (max-width: 1000px), (orientation: portrait) {
      .revisao { grid-template-columns: 1fr; gap: 28px; }
      #foto { max-height: 36vh; }
      .painel { overflow-y: auto; padding: 20px 20px 20px 46px; }
      .marca span { display: none; }
      .controles { grid-template-columns: 1fr; justify-items: center; }
    }
  </style>
</head>
<body data-estado="carregando">
  <div class="barra" aria-hidden="true"></div>

  <header class="topo">
    <div class="marca"><img src="logo-senai-branco.png" alt="SENAI — Serviço Nacional de Aprendizagem Industrial"><span>Cabine Mágica</span></div>
    <div class="chip" id="camera" aria-live="polite">Conectando câmera…</div>
  </header>

  <main class="palco">
    <canvas id="tela" role="img" aria-label="Prévia ao vivo da câmera com a moldura do evento"></canvas>
    <div class="contagem" id="contagem" aria-live="assertive"></div>
  </main>

  <footer class="controles">
    <p class="dica"><kbd>Enter</kbd> <strong>Tirar foto</strong></p>
    <button class="disparo" id="disparo" aria-label="Tirar foto"></button>
    <p class="dica"><kbd>C</kbd> Trocar câmera <kbd>F</kbd> Tela cheia</p>
  </footer>

  <div class="flash" id="flash"></div>

  <section class="painel" id="revisao" aria-labelledby="revisao-titulo">
    <div class="revisao">
      <div class="revisao-foto">
        <img id="foto" alt="Sua foto com a moldura do evento">
        <div class="ajustes" role="group" aria-label="Ajuste da foto">
          <div id="presets"></div>
          <span class="rotulo"><kbd>−</kbd><kbd>+</kbd> trocar ajuste</span>
        </div>
      </div>
      <form class="cartao" id="form" novalidate>
        <p class="sobretitulo">Mundo SENAI 2026 · #EU_FUI!</p>
        <h1 class="titulo" id="revisao-titulo">Ficou <em>incrível!</em></h1>
        <label for="whatsapp">Digite seu WhatsApp para receber a foto</label>
        <div class="campo">
          <span aria-hidden="true">+55</span>
          <input id="whatsapp" inputmode="numeric" autocomplete="off" placeholder="(49) 99999-9999" aria-describedby="erro legal">
        </div>
        <p class="erro" id="erro" role="alert"></p>
        <button class="botao primario" id="enviar" type="submit"><span>Pular e concluir</span><kbd>Enter</kbd></button>
        <button class="botao secundario" id="refazer" type="button"><span>Tirar outra foto</span><kbd>Esc</kbd></button>
        <p class="legal" id="legal">Ao enviar, você autoriza o SENAI a mandar esta foto para o seu WhatsApp. Seu número não será usado para mais nada.</p>
      </form>
    </div>
  </section>

  <section class="painel" id="enviado" aria-live="polite">
    <div class="final">
      <svg class="selo" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="25"/><path d="M15 27l7 7 15-15"/></svg>
      <h2 class="titulo" id="final-titulo"></h2>
      <p id="final-msg"></p>
      <div class="barra-tempo" aria-hidden="true"><span></span></div>
    </div>
  </section>

  <section class="painel" id="erro-painel" role="alert">
    <div class="cartao">
      <h2 class="titulo">A câmera precisa de atenção</h2>
      <p id="erro-msg"></p>
      <button class="botao primario" id="tentar" onclick="location.reload()"><span>Tentar novamente</span><kbd>Enter</kbd></button>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
